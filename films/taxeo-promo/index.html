<!doctype html>
<html lang="pl"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Tło","default":"#FFFFFF"},
    {"id":"color-ink","type":"color","label":"Tekst","default":"#191514"},
    {"id":"color-accent","type":"color","label":"Akcent","default":"#0092FF"},
    {"id":"font-display","type":"string","label":"Font","default":"Roboto"}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      /* Taxeo tokens from the capture of taxeo.pl (extracted/tokens.json + screenshots). */
      :root {
        --color-ground: #ffffff; --color-ink: #191514; --muted: #666666; --color-accent: #0092ff;
        --button: #4b7aa7; --sky: #eaf4ff; --sky-2: #d7ebff; --line: #dddddd;
        --font-display: "Roboto";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Roboto", sans-serif; color: var(--color-ink); }
      #ground { position: absolute; inset: 0; background: var(--color-ground); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="3.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="hero" data-composition-id="hero" data-composition-src="compositions/hero.html" data-start="3.5" data-duration="4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="why" data-composition-id="why" data-composition-src="compositions/why.html" data-start="7.5" data-duration="4.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="duo" data-composition-id="duo" data-composition-src="compositions/duo.html" data-start="12" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="price" data-composition-id="price" data-composition-src="compositions/price.html" data-start="18" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="quote" data-composition-id="quote" data-composition-src="compositions/quote.html" data-start="24" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="27" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- Sound on visible actions (bundled HyperFrames SFX); peaks land one frame after the picture. -->
      <audio id="sfx-c1" class="clip" src="assets/sfx/pop.mp3" data-start="0.05" data-duration="0.72" data-track-index="10" data-volume="0.45"></audio>
      <audio id="sfx-c2" class="clip" src="assets/sfx/pop.mp3" data-start="0.62" data-duration="0.72" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-c3" class="clip" src="assets/sfx/pop.mp3" data-start="1.17" data-duration="0.72" data-track-index="10" data-volume="0.35"></audio>
      <audio id="sfx-c4" class="clip" src="assets/sfx/pop.mp3" data-start="1.72" data-duration="0.72" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-w1" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.95" data-duration="0.57" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-w2" class="clip" src="assets/sfx/whoosh.mp3" data-start="7.2" data-duration="0.46" data-track-index="12" data-volume="0.4" data-playback-rate="1.25"></audio>
      <audio id="sfx-w3" class="clip" src="assets/sfx/whoosh.mp3" data-start="11.85" data-duration="0.57" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-w4" class="clip" src="assets/sfx/whoosh.mp3" data-start="17.6" data-duration="0.67" data-track-index="12" data-volume="0.4" data-playback-rate="0.85"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/click-soft.mp3" data-start="27.62" data-duration="0.36" data-track-index="13" data-volume="0.7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
