  <script>
    (function () {
      // Example listing text from fixtures/listings/ls-001 (synthetic), without price and address (brand rule).
      const TEXT = "Mieszkanie 3-pokojowe, 58,5 m², IV piętro w budynku 7-kondygnacyjnym. Salon z aneksem kuchennym, dwie sypialnie, łazienka, przedpokój. Balkon 5,2 m².";
      const typed = document.getElementById("s-typed");
      const st = { n: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#s-card", { x: 1150 }, { x: 0, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo(["#s-title", "#s-sub"], { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.12 }, 0.25);
      // Pasted text appears in chunks, like a paste rendering line by line.
      tl.fromTo(st, { n: 0 }, { n: TEXT.length, duration: 1.0, ease: "power1.inOut",
        onUpdate: () => { typed.textContent = TEXT.slice(0, Math.round(st.n)); } }, 0.5);
      tl.set("#s-caret", { opacity: 0 }, 1.6);
      // The PDF lands in the drop zone.
      tl.fromTo("#s-chip", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 1.8);
      // Press, then the stepper walks to the report.
      tl.to("#s-btn", { scale: 0.97, duration: 0.08, ease: "power1.out" }, 2.45);
      tl.to("#s-btn", { scale: 1, duration: 0.12, ease: "power1.out" }, 2.53);
      ["#s-1", "#s-2", "#s-3"].forEach((id, i) => {
        const t = 2.7 + i * 0.3;
        tl.set(id, { className: "s-step done" }, t);
        tl.set(id + " .s-dot", { textContent: "✓" }, t);
        tl.set("#s-" + (i + 2), { className: "s-step cur" }, t);
      });
      tl.to("#s-stage", { x: -1150, duration: 0.3, ease: "power3.in" }, 4.2);
      window.__timelines["steps"] = tl;
    })();
  </script>
