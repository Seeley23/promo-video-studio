  <script>
    (function () {
      // Sun model from lib/sun.ts and PlanSheet.tsx; the time of day is driven by the timeline.
      const rad = (d) => (d * Math.PI) / 180, deg = (r) => (r * 180) / Math.PI;
      function solar(min) {
        const lat = rad(52), dec = rad(23.44), h = rad(min / 4 - 180);
        const sa = Math.max(-1, Math.min(1, Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(h)));
        const az = Math.atan2(Math.sin(h), Math.cos(h) * Math.sin(lat) - Math.tan(dec) * Math.cos(lat));
        return { altitude: deg(Math.asin(sa)), azimuth: (((deg(az) + 180) % 360) + 360) % 360 };
      }
      const ang = (a, b) => Math.abs(((((a - b + 180) % 360) + 360) % 360) - 180);
      const WINDOWS = [
        { room: "salon", wall: 90, a: [30, 100], b: [30, 180] }, { room: "salon", wall: 180, a: [70, 60], b: [200, 60] },
        { room: "bedSouth", wall: 180, a: [320, 60], b: [410, 60] }, { room: "bedWest", wall: 270, a: [450, 240], b: [450, 290] },
      ];
      const NS = "http://www.w3.org/2000/svg", light = document.getElementById("u-light");
      const polys = WINDOWS.map((w) => { const el = document.createElementNS(NS, "polygon"); el.setAttribute("clip-path", "url(#u-clip-" + w.room + ")"); light.appendChild(el); return el; });
      const sunEl = document.getElementById("u-sun"), clock = document.getElementById("u-clock");
      function render(min) {
        const sun = solar(min);
        const t = Math.min(1, Math.max(0, (sun.azimuth - 50) / 260)), u = 1 - t;
        sunEl.setAttribute("cx", (u * u * 60 + 2 * u * t * 240 + t * t * 420).toFixed(1));
        sunEl.setAttribute("cy", (u * u * 54 + 2 * u * t * -8 + t * t * 54).toFixed(1));
        WINDOWS.forEach((w, i) => {
          const on = sun.altitude > 0 && ang(sun.azimuth, w.wall) < 89;
          if (!on) { polys[i].setAttribute("points", ""); return; }
          const az = rad(sun.azimuth), dx = Math.sin(az), dy = -Math.cos(az), cot = 1 / Math.tan(rad(Math.max(sun.altitude, 2)));
          const near = Math.min(0.9 * cot * 36, 600), far = Math.min(2.2 * cot * 36, 600);
          const pt = ([x, y], s) => (x + dx * s).toFixed(1) + "," + (y + dy * s).toFixed(1);
          polys[i].setAttribute("points", [pt(w.a, near), pt(w.b, near), pt(w.b, far), pt(w.a, far)].join(" "));
          polys[i].style.fillOpacity = 0.16 + 0.42 * Math.max(Math.cos(rad(ang(sun.azimuth, w.wall))), 0);
        });
        const m = Math.round(min / 30) * 30;
        clock.textContent = String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
      }
      document.getElementById("u-clash").setAttribute("d", "");
      const time = { m: 420 };
      render(time.m);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#u-sheet", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo("#u-title", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.15);
      // The sun crosses the arc from 07:00 to 19:00; the patches follow on the floor.
      tl.fromTo(time, { m: 420 }, { m: 1140, duration: 3.0, ease: "power1.inOut", onUpdate: () => render(time.m) }, 0.4);
      tl.fromTo("#u-note", { y: 60, opacity: 0, rotation: 0 }, { y: 0, opacity: 1, rotation: -1.2, duration: 0.45, ease: "power3.out" }, 1.6);
      tl.to("#u-stage", { opacity: 0, duration: 0.2, ease: "power2.in" }, 3.8);
      window.__timelines["sun"] = tl;
    })();
