  <script>
    (function () {
      // Same geometry and sun model as PlanSheet.tsx / lib/sun.ts (illustration at 10:00, summer, 52°N).
      const rad = (d) => (d * Math.PI) / 180, deg = (r) => (r * 180) / Math.PI;
      function solar(min) {
        const lat = rad(52), dec = rad(23.44), h = rad(min / 4 - 180);
        const sa = Math.max(-1, Math.min(1, Math.sin(lat) * Math.sin(dec) + Math.cos(lat) * Math.cos(dec) * Math.cos(h)));
        const az = Math.atan2(Math.sin(h), Math.cos(h) * Math.sin(lat) - Math.tan(dec) * Math.cos(lat));
        return { altitude: deg(Math.asin(sa)), azimuth: (((deg(az) + 180) % 360) + 360) % 360 };
      }
      const ang = (a, b) => Math.abs(((((a - b + 180) % 360) + 360) % 360) - 180);
      const WINDOWS = [
        { room: "salon", wall: 90, a: [30, 100], b: [30, 180] }, { room: "salon", wall: 180, a: [70, 60], b: [200, 60] },
        { room: "bedSouth", wall: 180, a: [320, 60], b: [410, 60] }, { room: "bedWest", wall: 270, a: [450, 240], b: [450, 290] },
      ];
      function patch(sun, w) {
        const az = rad(sun.azimuth), dx = Math.sin(az), dy = -Math.cos(az);
        const cot = 1 / Math.tan(rad(Math.max(sun.altitude, 2)));
        const near = Math.min(0.9 * cot * 36, 600), far = Math.min(2.2 * cot * 36, 600);
        const pt = ([x, y], s) => (x + dx * s).toFixed(1) + "," + (y + dy * s).toFixed(1);
        const inc = Math.cos(rad(ang(sun.azimuth, w.wall)));
        return { points: [pt(w.a, near), pt(w.b, near), pt(w.b, far), pt(w.a, far)].join(" "), opacity: 0.16 + 0.42 * Math.max(inc, 0) };
      }
      const sun = solar(600);
      const t = Math.min(1, Math.max(0, (sun.azimuth - 50) / 260)), u = 1 - t;
      const sunEl = document.getElementById("p-sun");
      sunEl.setAttribute("cx", (u * u * 60 + 2 * u * t * 240 + t * t * 420).toFixed(1));
      sunEl.setAttribute("cy", (u * u * 54 + 2 * u * t * -8 + t * t * 54).toFixed(1));
      const light = document.getElementById("p-light");
      WINDOWS.forEach((w) => {
        if (!(sun.altitude > 0 && ang(sun.azimuth, w.wall) < 89)) return;
        const p = patch(sun, w);
        const el = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        el.setAttribute("points", p.points); el.setAttribute("clip-path", "url(#p-clip-" + w.room + ")");
        el.style.fillOpacity = p.opacity; light.appendChild(el);
      });
      function cloudPath(cx, cy, rx, ry, n) {
        const p = Array.from({ length: n }, (_, i) => { const a = (i / n) * Math.PI * 2 - Math.PI / 2; return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
        const parts = ["M" + p[0][0].toFixed(2) + " " + p[0][1].toFixed(2)];
        for (let i = 1; i <= n; i++) { const [px, py] = p[(i - 1) % n], [x, y] = p[i % n]; const r = (Math.hypot(x - px, y - py) / 2) * 1.08;
          parts.push("A" + r.toFixed(2) + " " + r.toFixed(2) + " 0 0 1 " + x.toFixed(2) + " " + y.toFixed(2)); }
        return parts.join(" ") + " Z";
      }
      document.getElementById("p-clash").setAttribute("d", cloudPath(236, 262, 36, 31, 13));

      const tl = gsap.timeline({ paused: true });
      // The next sheet slides in from the right, as the listing was pushed out to the left.
      tl.fromTo("#p-folder", { x: 1150 }, { x: 0, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo("#p-title", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.25);
      // Line drawing, then annotations (app/globals.css: draw, fade, pop; same order).
      tl.fromTo(".p-draw.wall", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.3);
      tl.fromTo(".p-draw.wall-inner", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.45);
      tl.fromTo(["#p-win", "#p-north"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.45);
      tl.fromTo(["#p-furn", "#p-doors"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.75);
      tl.fromTo("#p-rooms", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.95);
      tl.fromTo(".p-draw.sun-path", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.95);
      tl.fromTo(["#p-light", "#p-sun"], { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.2);
      tl.fromTo("#p-clash", { strokeDasharray: 1, strokeDashoffset: 1, fillOpacity: 0 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 1.4);
      tl.to("#p-clash", { fillOpacity: 1, duration: 0.25, ease: "none" }, 2.1);
      ["#p-c1", "#p-c2", "#p-c3"].forEach((s, i) => {
        tl.fromTo(s, { opacity: 0, scale: 0.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 2.0 + i * 0.18);
      });
      // The argument slip slides out from under the folder.
      tl.fromTo("#p-slip", { y: 90, opacity: 0, rotation: 0 }, { y: 0, opacity: 1, rotation: -1.2, duration: 0.45, ease: "power3.out" }, 2.7);
      tl.to("#p-stage", { opacity: 0, duration: 0.2, ease: "power2.in" }, 4.8);
      window.__timelines["plan"] = tl;
    })();
