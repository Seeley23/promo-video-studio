  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const fmt = new Intl.NumberFormat("pl-PL", { style: "currency", currency: "PLN", minimumFractionDigits: 0, maximumFractionDigits: 0 });
      const cur = (v) => fmt.format(v);

      // Slider ranges and the site's default values (LossCalculator.tsx).
      const R = {
        rev: { min: 10000, max: 500000, step: 10000, to: 50000 },
        conv: { min: 0.5, max: 10, step: 0.5, to: 2.5 },
        aov: { min: 50, max: 5000, step: 50, to: 150 },
        churn: { min: 5, max: 50, step: 1, to: 15 },
        team: { min: 1, max: 50, step: 1, to: 5 },
      };
      const S = { rev: 10000, conv: 0.5, aov: 50, churn: 5, team: 1 };

      function snap(k) { const r = R[k]; return Math.round((S[k] - r.min) / r.step) * r.step + r.min; }

      // Same formula as the site's useMemo.
      function render() {
        const rev = snap("rev"), conv = snap("conv"), aov = snap("aov"), churn = snap("churn"), team = snap("team");
        for (const k of Object.keys(R)) {
          const f = (snap(k) - R[k].min) / (R[k].max - R[k].min);
          $("r-" + k).style.transform = "scaleX(" + f + ")";
          $("t-" + k).style.left = (f * 100) + "%";
        }
        $("v-rev").textContent = cur(rev);
        $("v-conv").textContent = conv.toFixed(1) + "%";
        $("v-aov").textContent = cur(aov);
        $("v-churn").textContent = churn.toFixed(0) + "%";
        $("v-team").textContent = team + " osób";
        const cur_ = (rev / aov) * (conv / 100);
        const pot = cur_ / 0.4;
        const convLoss = Math.round((pot - cur_) * aov);
        const churnLoss = Math.round((rev / aov) * (churn / 100) * aov);
        const timeLoss = Math.round(team * 4000 * 0.3);
        const total = Math.round((pot - cur_) * aov + (rev / aov) * (churn / 100) * aov + team * 4000 * 0.3);
        const annual = total * 12;
        const rec = Math.round(total * 380 / 100);
        $("o-conv").textContent = cur(convLoss) + "/msc";
        $("o-churn").textContent = cur(churnLoss) + "/msc";
        $("o-time").textContent = cur(timeLoss) + "/msc";
        $("o-total").textContent = cur(total);
        $("o-daily").textContent = "To " + Math.round(total / 30) + " PLN dziennie";
        $("o-annual").textContent = cur(annual);
        $("o-months").textContent = "Równowartość " + Math.round(annual / 50000) + " pełnych miesięcy przychodu";
        $("o-rec").textContent = cur(rec) + "/msc";
        $("o-rec-y").textContent = "Średni wzrost konwersji +380% = " + cur(rec * 12) + " rocznie";
      }
      render();

      // The new screen comes in slightly large and settles (whole calculator: the workspace).
      tl.fromTo("#c-cam", { scale: 1.06, x: -57.6, y: -32.4, filter: "blur(10px)" },
        { scale: 1, x: 0, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0);

      // Sliders move one after another; the results recompute live, like on the site.
      const order = ["rev", "conv", "aov", "churn", "team"];
      order.forEach((k, i) => {
        tl.to(S, { [k]: R[k].to, duration: 0.5, ease: "power2.inOut", onUpdate: render }, 0.35 + i * 0.36);
      });

      // Camera: push in on the monthly total (the one number that matters).
      // Measured in Chrome at 1x: centre of the monthly total card.
      const cx = 1256, cy = 497.2;
      const s1 = 1.8, s2 = 1.9;
      tl.to("#c-cam", { scale: s1, x: 960 - s1 * cx, y: 470 - s1 * cy, duration: 0.6, ease: "power2.inOut" }, 2.4);

      // Carry: everything but the total clears; the total moves right for the line.
      const others = ["#c-h1", "#c-lead", "#c-inputs", "#c-breakdown", "#c-annual", "#c-recovery", "#c-cta"];
      tl.to(others, { opacity: 0, filter: "blur(14px)", duration: 0.3, ease: "power3.in" }, 3.7);
      tl.to("#c-page", { background: "rgba(2,3,6,0)", borderTopColor: "rgba(0,0,0,0)", duration: 0.3, ease: "power2.inOut" }, 3.7);
      tl.to("#c-cam", { scale: s2, x: 1320 - s2 * cx, y: 540 - s2 * cy, duration: 0.55, ease: "power2.inOut" }, 3.75);

      tl.fromTo("#c-title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 4.1);
      tl.to("#c-title", { opacity: 0, filter: "blur(8px)", duration: 0.18, ease: "power3.in" }, 6.42);

      window.__timelines["calc"] = tl;
    })();
  </script>
