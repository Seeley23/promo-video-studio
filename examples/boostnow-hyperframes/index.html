<!doctype html>
<html
  lang="pl"
  data-composition-variables='[
    {"id":"color-ground","type":"color","label":"Tło","default":"#05070C"},
    {"id":"color-ink","type":"color","label":"Tekst","default":"#EBEFF5"},
    {"id":"color-accent","type":"color","label":"Akcent","default":"#AEF512"},
    {"id":"font-display","type":"string","label":"Font nagłówków","default":"Poppins"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --color-ground: #05070c;
        --color-ink: #ebeff5;
        --color-accent: #aef512;
        --font-display: "Poppins";
        --card: #06090f;
        --secondary: #12161d;
        --muted: #181b1f;
        --muted-fg: #7d8086;
        --border: #1f2227;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Inter", sans-serif;
        color: var(--color-ink);
      }
      #ground {
        position: absolute;
        inset: 0;
        background: var(--color-ground);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <div id="ground"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="3.6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <div id="errors" data-composition-id="errors" data-composition-src="compositions/errors.html"
        data-start="3.6" data-duration="4.4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <div id="calc" data-composition-id="calc" data-composition-src="compositions/calc.html"
        data-start="8" data-duration="6.6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
        data-start="14.6" data-duration="2.6" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <div id="verbs" data-composition-id="verbs" data-composition-src="compositions/verbs.html"
        data-start="17.2" data-duration="5.2" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <div id="proof" data-composition-id="proof" data-composition-src="compositions/proof.html"
        data-start="22.4" data-duration="4.2" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="26.6" data-duration="3.4" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <!-- Sound on visible actions; each peak lands one frame after its picture. -->
      <audio id="sfx-flick" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.49" data-duration="0.57" data-track-index="10" data-volume="0.8"></audio>
      <audio id="sfx-whip1" class="clip" src="assets/sfx/whoosh.mp3" data-start="3.24" data-duration="0.46" data-track-index="11" data-volume="0.55" data-playback-rate="1.25"></audio>
      <audio id="sfx-pile" class="clip" src="assets/sfx/pop.mp3" data-start="3.74" data-duration="0.72" data-track-index="12" data-volume="0.6"></audio>
      <audio id="sfx-calc" class="clip" src="assets/sfx/whoosh.mp3" data-start="7.9" data-duration="0.57" data-track-index="10" data-volume="0.5" data-playback-rate="0.85"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="13.05" data-media-start="1.4" data-duration="2.2" data-track-index="13" data-volume="0.35" data-fade-out="0.2"></audio>
      <audio id="sfx-impact" class="clip" src="assets/sfx/impact.mp3" data-start="15.08" data-duration="2.1" data-track-index="14" data-volume="0.6"></audio>
      <audio id="sfx-whip2" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="16.56" data-media-start="1.9" data-duration="1.2" data-track-index="11" data-volume="0.6" data-fade-out="0.3"></audio>
      <audio id="sfx-roll1" class="clip" src="assets/sfx/click-soft.mp3" data-start="19.06" data-duration="0.36" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-roll2" class="clip" src="assets/sfx/click-soft.mp3" data-start="20.76" data-duration="0.36" data-track-index="12" data-volume="0.7"></audio>
      <audio id="sfx-result" class="clip" src="assets/sfx/pop.mp3" data-start="23.62" data-duration="0.72" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-push" class="clip" src="assets/sfx/whoosh.mp3" data-start="24.85" data-duration="0.57" data-track-index="10" data-volume="0.45" data-playback-rate="1.1"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/pop.mp3" data-start="27.46" data-duration="0.72" data-track-index="12" data-volume="0.7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
